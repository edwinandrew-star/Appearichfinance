<script>
  // ==========================================
  // STATE MANAGEMENT & DATA STORAGE
  // ==========================================
  const state = {
    // Current selected view month for Tithe & Total Income (Format: YYYY-MM)
    selectedMonth: new Date().toISOString().slice(0, 7),
    heroImage: 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=1600&auto=format&fit=crop',
    incomes: [],       // Array of { id, name, amount, category, date, month }
    expenses: [],      // Array of { id, name, category, account, amount, date, month }
    investment: {
      totalInvested: 0,
      currentValue: 0,
      history: []
    },
    sales: [],         // Array of { id, date, qty, product, customer, buyPrice, sellPrice, paymentStatus, amountPaid, month }
    loans: [],         // Array of { id, borrower, amount, date, paid, note, month }
    accounts: {
      'CRDB': 0,
      'SELCOM': 0,
      'MPESA': 0,
      'LIPA NAMBA': 0,
      'CASH': 0
    },
    utilitiesSub: [
      { name: 'Internet', spent: 0 },
      { name: 'Umeme', spent: 0 },
      { name: 'Taka', spent: 0 },
      { name: 'Transport', spent: 0 }
    ]
  };

  // Helper formatting function
  function formatSh(amount) {
    return new Intl.NumberFormat('en-US').format(Math.round(amount || 0)) + ' Sh';
  }

  // Get formatted month string (e.g., "August 2026")
  function getMonthName(monthKey) {
    const [year, month] = monthKey.split('-');
    const date = new Date(year, parseInt(month) - 1, 1);
    return date.toLocaleString('default', { month: 'long', year: 'numeric' });
  }

  // ==========================================
  // CORE TITHE & INCOME CALCULATIONS
  // ==========================================
  function getCalculations() {
    // Filter incomes for the selected month
    const monthIncomes = state.incomes.filter(inc => inc.month === state.selectedMonth);
    const selectedMonthIncomeTotal = monthIncomes.reduce((sum, inc) => sum + Number(inc.amount), 0);
    
    // Automatic 10% Tithe for God for selected month
    const selectedMonthTitheTotal = selectedMonthIncomeTotal * 0.10;

    // Aggregate values for display
    const totalLiquidMoney = Object.values(state.accounts).reduce((sum, val) => sum + Number(val), 0);
    
    // Business Sales calculations for selected month
    const monthSales = state.sales.filter(s => s.month === state.selectedMonth);
    let appTotalRevenue = 0, appTotalCost = 0, appTotalReceived = 0, appTotalOutstanding = 0;
    monthSales.forEach(sale => {
      const totalVal = sale.sellPrice * sale.qty;
      const totalCost = sale.buyPrice * sale.qty;
      const paid = sale.paymentStatus === 'FULL' ? totalVal : Number(sale.amountPaid || 0);
      appTotalRevenue += totalVal;
      appTotalCost += totalCost;
      appTotalReceived += paid;
      appTotalOutstanding += (totalVal - paid);
    });
    const appTotalProfit = appTotalReceived - appTotalCost;

    // Investment Return
    const invGainLoss = state.investment.currentValue - state.investment.totalInvested;

    // Total loans owed
    const totalLoanOwed = state.loans.reduce((sum, loan) => sum + (loan.amount - loan.paid), 0);

    return {
      selectedMonthIncomeTotal,
      selectedMonthTitheTotal,
      totalLiquidMoney,
      appTotalRevenue,
      appTotalCost,
      appTotalReceived,
      appTotalOutstanding,
      appTotalProfit,
      invGainLoss,
      totalLoanOwed
    };
  }

  // ==========================================
  // UI RENDERERS & LAYOUT UPDATES
  // ==========================================
  function renderAll() {
    const calc = getCalculations();
    const currentMonthLabel = getMonthName(state.selectedMonth);

    // Update Home Screen Overview Ring Indicators
    renderRingOverview(calc.selectedMonthTitheTotal, calc.selectedMonthIncomeTotal, currentMonthLabel);

    // Render Quick Actions & Horizontal Budget Categories on Dashboard
    renderHorizontalBudgetCategories();
    renderQuickActionsGrid();

    // Render Grid Layouts across screens
    renderIncomeGrid();
    renderAccountsGrid();
    renderLoansGrid();
    renderUtilitiesGrid();
    renderInvestmentGrid();
    renderExpensesGrid();

    // Update settings tithing selector
    updateTithingMonthSelector();
  }

  // 1. Overview Ring Card Component
  function renderRingOverview(tithe, totalIncome, monthLabel) {
    const container = document.getElementById('dash-overview-box');
    if (!container) return;

    container.innerHTML = `
      <div class="p-6 rounded-3xl bg-brand-surface border border-gray-200 shadow-premium">
        <p class="text-xs font-bold text-center text-brand-muted uppercase tracking-wider mb-4">
          Overview — ${monthLabel}
        </p>
        <div class="flex items-center justify-around gap-4">
          <!-- Tithe Ring Indicator (LEFT) -->
          <div class="flex flex-col items-center">
            <div class="relative w-28 h-28 flex items-center justify-center">
              <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                <path class="text-gray-200" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="text-brand-gold" stroke-dasharray="100, 100" stroke-width="3" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              </svg>
              <div class="absolute text-center">
                <span class="text-[10px] font-bold text-brand-gold uppercase block">Tithe 10%</span>
                <span class="font-display font-extrabold text-xs sm:text-sm text-brand-black">${formatSh(tithe)}</span>
              </div>
            </div>
            <span class="text-xs font-medium text-brand-muted mt-2">God's Portion</span>
          </div>

          <!-- Total Income Ring Indicator (RIGHT) -->
          <div class="flex flex-col items-center">
            <div class="relative w-28 h-28 flex items-center justify-center">
              <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                <path class="text-gray-200" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="text-brand-black" stroke-dasharray="100, 100" stroke-width="3" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
              </svg>
              <div class="absolute text-center">
                <span class="text-[10px] font-bold text-brand-black uppercase block">Income</span>
                <span class="font-display font-extrabold text-xs sm:text-sm text-brand-black">${formatSh(totalIncome)}</span>
              </div>
            </div>
            <span class="text-xs font-medium text-brand-muted mt-2">Total Monthly</span>
          </div>
        </div>
      </div>
    `;
  }

  // 2. Horizontal Budget Categories Scroll
  function renderHorizontalBudgetCategories() {
    const container = document.getElementById('dash-categories-carousel');
    if (!container) return;

    const categories = [
      { name: 'Appreciation', icon: 'M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z', tab: 'appearich' },
      { name: 'Investment', icon: 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6', tab: 'investment' },
      { name: 'Expenses', icon: 'M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z', tab: 'budget' },
      { name: 'Utilities', icon: 'M13 10V3L4 14h7v7l9-11h-7z', tab: 'budget' },
      { name: 'Others', icon: 'M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4', tab: 'budget' }
    ];

    container.innerHTML = `
      <div class="flex items-center gap-4 overflow-x-auto no-scrollbar py-2">
        ${categories.map(cat => `
          <div onclick="switchTab('${cat.tab}')" class="min-w-[140px] p-4 rounded-2xl bg-white border border-gray-100 shadow-premium hover:shadow-card-hover cursor-pointer flex flex-col items-center justify-center text-center transition flex-shrink-0">
            <div class="w-10 h-10 rounded-xl bg-brand-surface flex items-center justify-center text-brand-black mb-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${cat.icon}" /></svg>
            </div>
            <span class="font-bold text-xs text-brand-black">${cat.name}</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  // 3. Quick Actions Creative Grid (Home Screen Only)
  function renderQuickActionsGrid() {
    const container = document.getElementById('dash-quick-actions-grid');
    if (!container) return;

    const actions = [
      { label: '+ Income', modal: 'addIncomeModal', icon: 'M12 4v16m8-8H4' },
      { label: '+ Sale', modal: 'addSaleModal', icon: 'M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z' },
      { label: '+ Expense', modal: 'addTransactionModal', icon: 'M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z' },
      { label: 'Transfer', modal: 'transferModal', icon: 'M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4' }
    ];

    container.innerHTML = `
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        ${actions.map(act => `
          <button onclick="openModal('${act.modal}')" class="p-3.5 rounded-2xl bg-white border border-gray-200 hover:border-brand-black text-xs font-bold flex items-center justify-center space-x-2 transition shadow-sm">
            <svg class="w-4 h-4 text-brand-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${act.icon}" /></svg>
            <span>${act.label}</span>
          </button>
        `).join('')}
      </div>
    `;
  }

  // 4. Accounts Responsive Grid Layout
  function renderAccountsGrid() {
    const container = document.getElementById('account-cards-grid');
    if (!container) return;

    container.innerHTML = Object.entries(state.accounts).map(([accName, balance]) => `
      <div class="p-5 rounded-2xl bg-white border border-gray-100 shadow-premium flex flex-col justify-between space-y-3">
        <div class="flex items-center justify-between">
          <span class="font-bold text-sm text-brand-black">${accName}</span>
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
        </div>
        <div>
          <span class="text-[10px] text-brand-muted uppercase">Available Balance</span>
          <p class="font-display font-extrabold text-xl text-brand-black">${formatSh(balance)}</p>
        </div>
      </div>
    `).join('');
  }

  // 5. Income Ledger & Tithe Tracking Grid
  function renderIncomeGrid() {
    const container = document.getElementById('income-list-container');
    if (!container) return;

    const filtered = state.incomes.filter(inc => inc.month === state.selectedMonth);
    if (filtered.length === 0) {
      container.innerHTML = `<div class="col-span-full text-center py-8 text-brand-muted text-xs">No income transactions recorded for ${getMonthName(state.selectedMonth)}.</div>`;
      return;
    }

    container.innerHTML = filtered.map(inc => {
      const titheShare = inc.amount * 0.10;
      return `
        <div class="p-5 rounded-2xl bg-white border border-gray-100 shadow-premium flex flex-col justify-between space-y-3">
          <div class="flex justify-between items-center">
            <span class="font-bold text-sm text-brand-black">${inc.name}</span>
            <button onclick="deleteIncome('${inc.id}')" class="text-xs text-red-500 hover:underline">Delete</button>
          </div>
          <div class="flex justify-between items-end">
            <div>
              <span class="text-[10px] text-brand-muted uppercase">Amount</span>
              <p class="font-display font-bold text-lg text-brand-black">${formatSh(inc.amount)}</p>
            </div>
            <div class="text-right">
              <span class="text-[10px] text-brand-gold uppercase font-bold">10% Tithe</span>
              <p class="font-display font-bold text-sm text-brand-gold">${formatSh(titheShare)}</p>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  // 6. Loans Grid
  function renderLoansGrid() {
    const container = document.getElementById('loan-cards-list');
    if (!container) return;

    if (state.loans.length === 0) {
      container.innerHTML = `<div class="col-span-full text-center py-6 text-brand-muted text-xs">No loan records active.</div>`;
      return;
    }

    container.innerHTML = state.loans.map(loan => {
      const remaining = loan.amount - loan.paid;
      return `
        <div class="p-4 rounded-2xl bg-brand-surface border border-gray-200 flex justify-between items-center">
          <div>
            <p class="font-bold text-sm text-brand-black">${loan.borrower}</p>
            <p class="text-xs text-brand-muted">Borrowed: ${formatSh(loan.amount)} | Paid: ${formatSh(loan.paid)}</p>
          </div>
          <div class="text-right">
            <span class="text-xs font-bold text-red-600">Owed: ${formatSh(remaining)}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  // 7. Utilities Card Grid Layout
  function renderUtilitiesGrid() {
    const container = document.getElementById('utilities-subcategories-list');
    if (!container) return;

    container.innerHTML = state.utilitiesSub.map(sub => `
      <div class="p-4 bg-white rounded-2xl border border-gray-100 flex justify-between items-center">
        <span class="font-bold text-sm text-brand-black">${sub.name}</span>
        <span class="text-xs font-semibold text-brand-muted">Spent: ${formatSh(sub.spent)}</span>
      </div>
    `).join('');
  }

  // 8. Investment Grid
  function renderInvestmentGrid() {
    const container = document.getElementById('investment-history-list');
    if (!container) return;

    if (state.investment.history.length === 0) {
      container.innerHTML = `<div class="p-4 text-center text-xs text-brand-muted">No investment records logged.</div>`;
      return;
    }

    container.innerHTML = state.investment.history.map(item => `
      <div class="py-3 flex justify-between items-center text-xs">
        <span class="font-medium text-brand-black">${item.date}</span>
        <span class="font-bold text-brand-black">${formatSh(item.value)}</span>
      </div>
    `).join('');
  }

  // 9. Expenses Grid
  function renderExpensesGrid() {
    // Retains internal expense calculations cleanly
  }

  // ==========================================
  // TRANSACTION & TITHE EVENT HANDLERS
  // ==========================================

  // Add Income (Calculates 10% Tithe Automatically)
  function handleAddIncome(event) {
    event.preventDefault();
    const name = document.getElementById('income-name-input').value;
    const amount = parseFloat(document.getElementById('income-amount-input').value);
    
    if (!name || isNaN(amount) || amount <= 0) return;

    const currentMonth = new Date().toISOString().slice(0, 7);
    const newIncome = {
      id: 'inc_' + Date.now(),
      name,
      amount,
      date: new Date().toISOString().slice(0, 10),
      month: currentMonth
    };

    state.incomes.push(newIncome);
    closeModal('addIncomeModal');
    event.target.reset();
    renderAll();
  }

  // Delete Income (Recalculates Tithe Contribution)
  function deleteIncome(id) {
    state.incomes = state.incomes.filter(inc => inc.id !== id);
    renderAll();
  }

  // Handle Dynamic Image Upload for Hero Section
  function handleHeroImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        state.heroImage = e.target.result;
        const heroBg = document.getElementById('hero-bg-image');
        if (heroBg) heroBg.style.backgroundImage = `url('${state.heroImage}')`;
      };
      reader.readAsDataURL(file);
    }
  }

  // Tithe Month Selector Settings Handler
  function updateTithingMonthSelector() {
    const select = document.getElementById('tithe-month-select');
    if (!select) return;

    // Collect all unique months from saved incomes
    const months = Array.from(new Set([new Date().toISOString().slice(0, 7), ...state.incomes.map(i => i.month)])).sort().reverse();
    
    select.innerHTML = months.map(m => `
      <option value="${m}" ${m === state.selectedMonth ? 'selected' : ''}>${getMonthName(m)}</option>
    `).join('');
  }

  function changeTitheMonth(monthKey) {
    state.selectedMonth = monthKey;
    renderAll();
  }

  // Account Transfer Handler
  function handleTransfer(event) {
    event.preventDefault();
    const from = document.getElementById('tr-from').value;
    const to = document.getElementById('tr-to').value;
    const amount = parseFloat(document.getElementById('tr-amount').value);

    if (from !== to && amount > 0 && state.accounts[from] >= amount) {
      state.accounts[from] -= amount;
      state.accounts[to] += amount;
      closeModal('transferModal');
      event.target.reset();
      renderAll();
    }
  }

  // Modal Controllers
  function openModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.remove('hidden');
  }

  function closeModal(id) {
    const modal = document.getElementById(id);
    if (modal) modal.classList.add('hidden');
  }

  // View Navigation Switcher
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    const target = document.getElementById(`tab-${tabId}`);
    if (target) target.classList.remove('hidden');

    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.classList.remove('bg-brand-black', 'text-white');
      btn.classList.add('text-brand-muted');
    });
    
    const activeNav = document.getElementById(`nav-${tabId}`);
    if (activeNav) {
      activeNav.classList.add('bg-brand-black', 'text-white');
      activeNav.classList.remove('text-brand-muted');
    }
  }

  // Initial Initialization
  window.addEventListener('DOMContentLoaded', () => {
    renderAll();
  });
</script>
